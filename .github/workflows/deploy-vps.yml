name: Deploy gptc.cc to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gptccc-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check protected purchase links
        run: |
          node ./scripts/check-purchase-link-lock.mjs

      - name: Check canonical host and analytics guard
        run: |
          node ./scripts/check-site-host-consistency.mjs

      - name: Test recharge providers
        run: |
          node --test ./recharge-center/test/*.test.js

      - name: Deploy homepage and blog to 1Panel
        env:
          PANEL_BASE: ${{ secrets.PANEL_BASE }}
          PANEL_ENTRANCE: ${{ secrets.PANEL_ENTRANCE }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          PANEL_TARGET_DIR: ${{ secrets.PANEL_TARGET_DIR }}
        run: |
          node ./scripts/deploy-to-1panel.mjs

      - name: Deploy recharge backend to 1Panel
        env:
          PANEL_BASE: ${{ secrets.PANEL_BASE }}
          PANEL_ENTRANCE: ${{ secrets.PANEL_ENTRANCE }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          PANEL_TARGET_DIR: ${{ secrets.PANEL_TARGET_DIR }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          node ./scripts/deploy-recharge-backend-1panel.mjs

      - name: Verify non-www redirects to www
        run: |
          curl -fsSI https://gptc.cc/ | grep -Eq '^HTTP/[^ ]+ (301|308)'
          curl -fsSI https://gptc.cc/ | grep -Eiq '^location: https://www\.gptc\.cc/'

      - name: Verify production homepage
        run: |
          curl -fsSL https://www.gptc.cc/ > /tmp/gptccc-home.html
          grep -q '<link rel="canonical" href="https://www.gptc.cc/">' /tmp/gptccc-home.html
          grep -q '<title>GPT充值，5分钟完成 | ChatGPT Plus / Pro 充值升级 | GPTC.cc</title>' /tmp/gptccc-home.html

      - name: Verify blog index
        run: |
          curl -fsSL https://www.gptc.cc/blog/ > /tmp/gptccc-blog.html
          grep -q '<link rel="canonical" href="https://www.gptc.cc/blog/">' /tmp/gptccc-blog.html
          grep -q '<title>GPTC.cc 充值升级指南｜Plus / Pro 开通、支付失败、续费失败</title>' /tmp/gptccc-blog.html

      - name: Verify activate page
        run: |
          curl -fsSL https://www.gptc.cc/activate/ > /tmp/gptccc-activate.html
          grep -q '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">' /tmp/gptccc-activate.html
          grep -q '<meta name="baiduspider" content="nofollow, noarchive">' /tmp/gptccc-activate.html
          ! grep -q '<link rel="canonical"' /tmp/gptccc-activate.html
          grep -q '<title>嘉哥AI Plus充值系统｜GPTC.cc</title>' /tmp/gptccc-activate.html
          grep -q '/api/recharge/verify-card' /tmp/gptccc-activate.html
          ! grep -q 'http-equiv="refresh"' /tmp/gptccc-activate.html
          ! grep -q '廖' /tmp/gptccc-activate.html
          curl -fsSL https://www.gptc.cc/robots.txt > /tmp/gptccc-robots.txt
          grep -q '^Disallow: /activate/$' /tmp/gptccc-robots.txt

      - name: Verify recharge backend routes
        run: |
          curl -fsSL https://www.gptc.cc/admin/provider > /tmp/gptccc-provider-admin.html
          grep -q '<title>源头切换后台｜GPTC.cc</title>' /tmp/gptccc-provider-admin.html
          grep -q '站内充值' /tmp/gptccc-provider-admin.html
          grep -q '反代充值' /tmp/gptccc-provider-admin.html
          grep -q '站外充值' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="xiaoyu_proxy"' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="sange_external"' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="ayan_external"' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="czgpt_external"' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="czgpt">廖</button>' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="czgpt_external">廖</button>' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="dnscon"' /tmp/gptccc-provider-admin.html
          grep -q 'data-provider="9977ai"' /tmp/gptccc-provider-admin.html
          curl -fsSL https://www.gptc.cc/api/recharge/provider > /tmp/gptccc-provider.json
          grep -q '"success":true' /tmp/gptccc-provider.json
          grep -q '"key":"sange_external"' /tmp/gptccc-provider.json
          grep -q '"key":"ayan_external"' /tmp/gptccc-provider.json
          grep -q '"key":"czgpt_external"' /tmp/gptccc-provider.json
          grep -q '"key":"czgpt","label":"l"' /tmp/gptccc-provider.json
          grep -q '"key":"czgpt_external","label":"l"' /tmp/gptccc-provider.json
          grep -q '"key":"xiaoyu_proxy","label":"小雨","mode":"proxy","location":"proxy"' /tmp/gptccc-provider.json
          grep -q '"key":"dnscon"' /tmp/gptccc-provider.json
          grep -q '"key":"9977ai"' /tmp/gptccc-provider.json

      - name: Verify Xiaoyu reverse proxy
        run: |
          curl -fsSL https://www.gptc.cc/self-recharge > /tmp/gptccc-xiaoyu.html
          curl -fsSI https://www.gptc.cc/self-recharge | grep -Eiq '^x-robots-tag: noindex, nofollow, noarchive'
          grep -q '<div id="app"></div>' /tmp/gptccc-xiaoyu.html
          grep -q '/xiaoyu-assets/index-' /tmp/gptccc-xiaoyu.html
          ! grep -q 'src="/assets/index-' /tmp/gptccc-xiaoyu.html
          XIAOYU_INDEX_PATH="$(sed -n 's/.*src="\([^"]*\/index-[^"]*\.js\)".*/\1/p' /tmp/gptccc-xiaoyu.html | head -n1)"
          test -n "$XIAOYU_INDEX_PATH"
          curl -fsSL "https://www.gptc.cc${XIAOYU_INDEX_PATH}" > /tmp/gptccc-xiaoyu-index.js
          XIAOYU_HTTP_ASSET="$(grep -o 'assets/http-[A-Za-z0-9_-]*\.js' /tmp/gptccc-xiaoyu-index.js | head -n1 | sed 's#^assets/#/xiaoyu-assets/#')"
          test -n "$XIAOYU_HTTP_ASSET"
          curl -fsSL "https://www.gptc.cc${XIAOYU_HTTP_ASSET}" > /tmp/gptccc-xiaoyu-http.js
          grep -q '/xiaoyu-api' /tmp/gptccc-xiaoyu-http.js
          ! grep -q 'https://autoserve.de10.online' /tmp/gptccc-xiaoyu-http.js
          curl -fsSL -X POST https://www.gptc.cc/xiaoyu-api/api/v1/card-keys/check-usage \
            -H 'Content-Type: application/json' \
            --data '{"key":"GPTC_REVERSE_PROXY_HEALTHCHECK"}' > /tmp/gptccc-xiaoyu-api.json
          grep -q '"code":0' /tmp/gptccc-xiaoyu-api.json
          curl -fsSL https://www.gptc.cc/robots.txt | grep -q '^Disallow: /self-recharge$'
